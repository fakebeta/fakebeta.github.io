<style>/* layout: one-screen logger. top bar (gym + date) / map or page / dock (grade palette) / tab bar.

  --bg:#e9ede9;--surface:#f8faf7;--surface2:#eef1ed;--ink:#17201b;--muted:#5f6a63;--line:#d3d9d4;

}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);overflow:hidden;overscroll-behavior:none;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--pick);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}

/* top bar */
#top{display:flex;align-items:center;gap:8px;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-weight:600;max-width:100%;white-space:nowrap}
#gymBtn{flex:1 1 0;min-width:0;justify-content:space-between;font-family:var(--f-disp)}
#gymBtn span{overflow:hidden;text-overflow:ellipsis}
#dateBtn{flex:none}
#dateBtn.shifted{border-color:var(--pick)}

/* pages */
main{flex:1;min-height:0;position:relative}
.page{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.scroll{overflow-y:auto;overscroll-behavior:contain;padding-block:14px 28px;flex:1}
.stack{display:flex;flex-direction:column;gap:14px;max-width:640px;margin:0 auto;width:100%}

/* map */
#view{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;background:var(--bg);cursor:grab;user-select:none;-webkit-user-select:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:18px;box-shadow:0 0 0 1px var(--line),var(--shadow)}
